name: tirtha_suraksha
description: "A smart crowd management solution for pilgrimage sites."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  flutter_staggered_grid_view: ^0.7.0
  google_maps_flutter: ^2.6.1
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.0.0
  just_audio: ^0.9.36
  video_player: ^2.8.6
  chewie: ^1.7.5
  flutter_reactive_ble: ^5.2.0
  permission_handler: ^11.3.1
  nearby_connections: ^4.3.0
  avatar_glow: ^3.0.1
  vibration: ^1.8.4
  volume_controller: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
    
  assets:
    - assets/images/
    - web_viewer/
    - assets/audio/
    - assets/videos/
    
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
